<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F7F3EC">
<title>婚礼邀请函</title>

<meta property="og:type" content="website">
<meta property="og:title" content="婚礼邀请函">
<meta property="og:description" content="诚邀您来见证我们的幸福">
<meta property="og:image" content="assets/photos/01.jpg">

<link rel="preload" as="image" href="assets/photos/01.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 开场（只等首屏图片，最长 3.2 秒） -->
<div id="boot">
  <div class="bx">
    <div class="xi">囍</div>
    <div class="bar"><i id="bootBar"></i></div>
    <div class="btxt">INVITATION</div>
  </div>
</div>

<!-- 整屏滑动舞台，内容由 app.js 按 config.js 生成 -->
<main id="stage"></main>

<!-- 右上角悬浮控件 -->
<div class="hud" id="hud">
  <button class="music" id="music" aria-label="播放/暂停音乐">
    <span class="disc">
      <i class="ring"></i>
      <i class="hole">
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg>
      </i>
    </span>
    <span class="mtext">
      <span class="mtitle" id="mTitle">背景音乐</span>
      <span class="martist" id="mArtist"></span>
    </span>
  </button>

  <button class="ctl" id="autoBtn" aria-label="暂停自动滚动">
    <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg>
  </button>
</div>

<!-- 页码 -->
<div class="dots" id="dots"></div>

<!-- 提示 -->
<div class="toast" id="toast"></div>

<audio id="bgm" preload="auto" playsinline webkit-playsinline x5-playsinline loop></audio>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FBEFE9">

<!-- ===== 分享卡片信息（微信/浏览器爬虫用）=====================
     微信抓链接时【不执行 JS】，所以这几行必须写死在 HTML 里。
     改完 config.js 之后跑一次：  python tools/sync_meta.py
     它会自动把下面这段和 boot 里的姓名同步成 config.js 的内容。
     ========================================================= -->
<title>秦钰杰 &amp; 吴雅男 · 婚礼邀请函</title>
<meta name="description" content="2026.10.06　诚邀您来见证我们的幸福">
<meta property="og:type" content="website">
<meta property="og:title" content="秦钰杰 &amp; 吴雅男 · 婚礼邀请函">
<meta property="og:description" content="2026.10.06　诚邀您来见证我们的幸福">
<meta property="og:image" content="https://qyj-tools.eu.cc/assets/img/share.jpg">
<meta property="og:url" content="https://qyj-tools.eu.cc/">
<meta name="twitter:card" content="summary">
<!-- ===== 分享卡片信息 结束 ===== -->

<link rel="icon" href="assets/img/share.jpg">
<link rel="apple-touch-icon" href="assets/img/share.jpg">
<link rel="preload" as="image" href="assets/photos/01.jpg">
<link rel="stylesheet" href="style.css?v=d35f9c45">
</head>
<body>

<!-- 开场（只等首屏图片，最长 3.2 秒）
     这里的照片和姓名同时也是微信抓取缩略图/标题的来源，别删 -->
<div id="boot">
  <div class="bx">
    <img class="bphoto" src="assets/img/share.jpg" width="800" height="800"
         alt="秦钰杰 &amp; 吴雅男 婚礼邀请函">
    <div class="bname">秦钰杰 &amp; 吴雅男</div>
    <div class="bar"><i id="bootBar"></i></div>
    <div class="btxt">诚 挚 邀 请</div>
  </div>
</div>

<!-- 整屏滑动舞台，内容由 app.js 按 config.js 生成 -->
<main id="stage"></main>

<!-- 右上角悬浮控件 -->
<div class="hud" id="hud">
  <button class="music" id="music" aria-label="播放或暂停音乐">
    <span class="mtext">
      <span class="mtitle" id="mTitle">背景音乐</span>
      <span class="mstatus" id="mStatus">音乐正在播放中…</span>
    </span>
    <span class="mart">
      <img src="assets/img/share.jpg" alt="" width="800" height="800">
      <span class="eq"><i></i><i></i><i></i><i></i></span>
    </span>
  </button>
</div>

<!-- 页码 -->
<div class="dots" id="dots"></div>

<!-- 提示 -->
<div class="toast" id="toast"></div>

<audio id="bgm" preload="metadata" playsinline webkit-playsinline x5-playsinline loop></audio>

<script src="config.js?v=2f84e467"></script>
<script src="app.js?v=0ed47c5d"></script>
</body>
</html>
